name: formedge_mobile
description: "FormEdge - horse racing predictions and analytics (mobile client)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Backend API access.
  http: ^1.2.2
  # Local cache of last-good payloads + persisted API base URL and JWT.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true